<!DOCTYPE html>
<html>

<head>
    <title>Crochet Row Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- content class holds all the stuff in middle of the screen -->
    <div class = "content">
        <h1>Row Counter</h1>

        <!-- rowCounterBg class holds the counter itself, with the buttons, text and bg images -->
        <div class = "rowCounterBg">
            <p id="rowCounter">
                Row: 0
            </p>
            <button onclick="removeRow()">-</button>
            <button onclick="addRow()">+</button>

        </div>

        <!-- button to change the image shown -->
        <button onclick="changeImage()" id = "changeImageButton">Change background image</button>
        <br>
        <input type="checkbox" id="showBackground" name="showBackground" value="yes" onclick="turnOffBgYarn()">
        <label for="vehicle1">Show background pattern?</label><br>
    </div>

    <script src="script.js"></script>
</body>

</html>
